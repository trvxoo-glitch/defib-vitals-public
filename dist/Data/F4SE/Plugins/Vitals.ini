; Vitals settings. 1 = on, 0 = off. Restart the game after changing.
; Output goes to Documents\My Games\Fallout4\F4SE\Vitals\
;   Vitals-Report.txt   plain-language report: problems, warnings and what to do (start here)
;   Vitals-summary.txt  short technical summary
;   Vitals.jsonl        every detail, one JSON object per line (for tools\defib_logs.py)
;   history\            earlier sessions' Vitals.jsonl (see iKeepSessions)
[Vitals]
; PLUGIN DOCTOR. At start-up (before the game reads its plugins) explain every F4SE DLL that is not running,
; check the load order for missing or inactive masters, and apply the rules in Vitals\knowledge\*.txt.
bDoctor=1
; Start-up message box: problems that may crash the game, and F4SE plugins that are installed but not running.
; 0 = never, 1 = only when there is something it has not shown before (default), 2 = every launch.
; Its "Don't show" button silences the plugins it listed; problems that may crash the game always show.
; The full list is always in Vitals-Report.txt.
iPopupMode=1
; How many earlier sessions to keep in Vitals\history (0 = none).
iKeepSessions=5
; What was running: game build, F4SE, every DLL in Data\F4SE\Plugins and whether it loaded.
bEnvironmentReport=1
; Check every ID listed in Data\F4SE\Plugins\Vitals\addresses\*.txt
bAddressCheck=1
; OPT-IN, ONE LAUNCH ONLY: save the bytes seen in memory as this build's baseline, in
; Documents\My Games\Fallout4\F4SE\Vitals\baselines\<OG|NG|AE>-<list>.txt. Later runs use it automatically,
; and installing a new Vitals never wipes it. Needed where Fallout4.exe is encrypted on disk (Steam 1.10.163).
; Do it on a launch with only F4SE + Vitals, then set it back to 0. The file is game data: keep it local.
bCaptureBaseline=0
; Crash-safe "which port hook ran last" ring.
bBreadcrumbs=1
; DEVELOPER, OPT-IN: list every Papyrus native function and which DLL registered it.
bPapyrusNatives=0
; DEVELOPER, OPT-IN (players leave this off): read known engine fields and report which offsets look right (main menu and after a load; it samples
; for about 5 seconds on a background thread, so give it that long before quitting).
bLayoutProbes=0
; How many bytes to read at each checked address (4-64).
iBytesToRead=16
; Writes every F4SE event to Vitals.jsonl and keeps status.json up to date (used by tools\smoke_test.ps1).
bTimeline=1
; TEST RIGS ONLY (0 = never). Ends the game N seconds after the main menu is ready / after a save or new game
; loads. The game is ended WITHOUT saving. Never turn this on for a profile you play.
iExitAfterMenuSeconds=0
iExitAfterLoadSeconds=0
