# Cloudflare Worker for Vitals share packs. Deploy steps: server/README.md.
name = "vitals-share"
main = "worker.js"
compatibility_date = "2026-10-01"

# Nothing about the sender is kept: no request logs.
[observability]
enabled = false

# Private bucket: no public access. A lifecycle rule (README step 4) deletes packs/ after 90 days.
[[r2_buckets]]
binding = "PACKS"
bucket_name = "vitals-share-packs"

# Rate limit counters (hashed, kept one hour). Put the id from `npx wrangler kv namespace create RATE` here.
[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file): `npx wrangler secret put READ_KEY` and `npx wrangler secret put SALT_KEY`.
